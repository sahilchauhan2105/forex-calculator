<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sahil FX Calculator</title>

<meta name="theme-color" content="#0b1220">
<meta name="description" content="Forex Position Size Calculator by Sahil">

<link rel="manifest" href="manifest.json">

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: radial-gradient(circle at top, #0f172a, #020617);
  color: white;
  overflow: hidden;
}

/* FLOATING CARDS */
.floating-cards {
  position: fixed;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.card {
  position: absolute;
  padding: 10px 15px;
  border-radius: 12px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  font-size: 12px;
  animation: floatUp 12s linear infinite;
}

.card:nth-child(1) { left: 10%; animation-delay: 0s; }
.card:nth-child(2) { left: 40%; animation-delay: 3s; }
.card:nth-child(3) { left: 70%; animation-delay: 6s; }
.card:nth-child(4) { left: 85%; animation-delay: 9s; }

@keyframes floatUp {
  0% { transform: translateY(100vh); opacity: 0; }
  20% { opacity: 1; }
  100% { transform: translateY(-20vh); opacity: 0; }
}

/* CONTAINER */
.container {
  width: 90%;
  max-width: 400px;
  margin: auto;
  margin-top: 60px;
  padding: 25px;
  border-radius: 20px;
  background: rgba(17,24,39,0.6);
  backdrop-filter: blur(20px);
  box-shadow: 0 0 40px rgba(0,0,0,0.5);
}

/* TITLE */
h2 {
  text-align: center;
  margin-bottom: 20px;
}

/* LABEL */
label {
  font-size: 13px;
  color: #9ca3af;
}

/* INPUT PREMIUM */
input, select {
  width: 100%;
  padding: 12px;
  margin: 6px 0 10px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05);
  color: white;
}

/* QUICK BUTTONS */
.quick-risk {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}

.quick-risk button {
  flex: 1;
  padding: 8px;
  border-radius: 8px;
  border: none;
  background: #1f2937;
  color: white;
  cursor: pointer;
}

.quick-risk button:hover {
  background: #10b981;
  color: black;
}

/* RESULT */
.result {
  margin-top: 15px;
  background: rgba(255,255,255,0.05);
  padding: 15px;
  border-radius: 12px;
}

.row {
  display: flex;
  justify-content: space-between;
}

#lot {
  font-size: 28px;
  color: #10b981;
  text-shadow: 0 0 10px #10b981;
}

/* INSTALL BUTTON */
#installBtn {
  margin-top: 15px;
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(90deg, #3b82f6, #06b6d4);
  color: white;
  font-weight: bold;
  box-shadow: 0 0 20px rgba(59,130,246,0.5);
  display: none;
}

/* PRICE INPUT */
#priceBox {
  display: none;
}
</style>
</head>

<body>

<!-- FLOATING CARDS (CORRECT PLACE ✅) -->
<div class="floating-cards">
  <div class="card">EURUSD<br>1.0912</div>
  <div class="card">GBPUSD<br>1.2704</div>
  <div class="card">USDJPY<br>153.67</div>
  <div class="card">XAUUSD<br>2025</div>
</div>

<div class="container">
  <h2>Sahil FX Calculator</h2>

  <label>Instrument</label>
  <select id="pair" onchange="togglePrice(); calculate();">
    <option value="EURUSD">EURUSD</option>
    <option value="AUDUSD">AUDUSD</option>
    <option value="NZDUSD">NZDUSD</option>
    <option value="USDJPY">USDJPY</option>
    <option value="USDCAD">USDCAD</option>
    <option value="XAUUSD">XAUUSD</option>
  </select>

  <div id="priceBox">
    <label>Enter Price</label>
    <input type="number" id="price" oninput="calculate()">
  </div>

  <label>Risk Amount ($)</label>
  <input type="number" id="risk" oninput="calculate()">

  <div class="quick-risk">
    <button onclick="setRisk(50)">$50</button>
    <button onclick="setRisk(100)">$100</button>
    <button onclick="setRisk(250)">$250</button>
  </div>

  <label>Stop Loss (pips)</label>
  <input type="number" id="sl" oninput="calculate()">

  <div class="result">
    <div class="row">
      <span>Lot Size</span>
      <span id="lot">0.00</span>
    </div>
  </div>

  <button id="installBtn">Install App</button>
</div>

<script>
function togglePrice() {
  let pair = document.getElementById("pair").value;
  let box = document.getElementById("priceBox");

  box.style.display =
    (pair === "USDJPY" || pair === "USDCAD" || pair === "XAUUSD")
    ? "block" : "none";
}

function setRisk(value) {
  document.getElementById("risk").value = value;
  calculate();
}

function calculate() {
  let pair = document.getElementById("pair").value;
  let risk = parseFloat(document.getElementById("risk").value);
  let sl = parseFloat(document.getElementById("sl").value);
  let price = parseFloat(document.getElementById("price").value);

  if (!risk || !sl) return;

  let pipValue;

  if (["EURUSD","AUDUSD","NZDUSD"].includes(pair)) pipValue = 10;
  else if (pair === "USDJPY") { if (!price) return; pipValue = 1000 / price; }
  else if (pair === "USDCAD") { if (!price) return; pipValue = 10 / price; }
  else if (pair === "XAUUSD") pipValue = 1;

  let lot = risk / (sl * pipValue);
  document.getElementById("lot").innerText = lot.toFixed(2);
}

let deferredPrompt;

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("installBtn").style.display = "block";
});

document.getElementById("installBtn").addEventListener("click", () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt = null;
  }
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
