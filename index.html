<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TAPPU BARIYA NU Calculator</title>

<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background:
    radial-gradient(circle at top, #0f172a, #020617),
    radial-gradient(circle at 80% 20%, rgba(16,185,129,0.15), transparent 40%);
  color: white;
  overflow: hidden;
}

/* FLOATING CARDS */
.floating-cards {
  position: fixed;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.card {
  position: absolute;
  padding: 12px 16px;
  border-radius: 14px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(15px);
  border: 1px solid rgba(255,255,255,0.2);
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
  font-size: 13px;
  animation: floatUp 12s linear infinite;
  opacity: 0.9;
}

.card:nth-child(1) { left: 10%; animation-delay: 0s; }
.card:nth-child(2) { left: 40%; animation-delay: 3s; }
.card:nth-child(3) { left: 70%; animation-delay: 6s; }
.card:nth-child(4) { left: 85%; animation-delay: 9s; }

@keyframes floatUp {
  0% { transform: translateY(100vh); opacity: 0; }
  20% { opacity: 1; }
  100% { transform: translateY(-20vh); opacity: 0; }
}

/* CONTAINER */
.container {
  position: relative;
  z-index: 10;
  width: 90%;
  max-width: 400px;
  margin: auto;
  margin-top: 60px;
  padding: 25px;
  border-radius: 20px;

  background: rgba(17,24,39,0.6);
  backdrop-filter: blur(20px);

  box-shadow:
    0 0 40px rgba(0,0,0,0.6),
    0 0 20px rgba(16,185,129,0.2);
}

/* HEADER */
h2 {
  text-align: center;
}

.title-main {
  color: #10b981;
  font-size: 22px;
  font-weight: bold;
}

.title-sub {
  font-size: 12px;
  color: #9ca3af;
}

/* INPUT */
input, select {
  width: 100%;
  padding: 12px;
  margin: 6px 0 10px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.05);
  color: white;
}

/* QUICK BUTTONS */
.quick-risk {
  display: flex;
  gap: 10px;
}

.quick-risk button {
  flex: 1;
  padding: 10px;
  border-radius: 10px;
  border: none;
  font-weight: bold;
  color: white;
  background: rgba(255,255,255,0.08);
  transition: 0.3s;
}

.quick-risk button:nth-child(1) { border: 1px solid #3b82f6; }
.quick-risk button:nth-child(2) { border: 1px solid #64748b; }
.quick-risk button:nth-child(3) { border: 1px solid #ef4444; }

.quick-risk button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(255,255,255,0.2);
}

/* RESULT */
.result {
  margin-top: 15px;
  background: rgba(255,255,255,0.05);
  padding: 15px;
  border-radius: 12px;
  position: relative;
}

.result::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 10%;
  width: 80%;
  height: 3px;
  background: linear-gradient(90deg, transparent, #10b981, transparent);
  box-shadow: 0 0 10px #10b981;
}

#lot {
  font-size: 28px;
  color: #10b981;
  text-shadow: 0 0 15px #10b981;
}

/* INSTALL BUTTON */
#installBtn {
  margin-top: 20px;
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: none;
  font-size: 16px;
  font-weight: bold;
  color: white;

  background: linear-gradient(90deg, #1e3a8a, #06b6d4);

  box-shadow:
    0 0 25px rgba(59,130,246,0.6),
    inset 0 0 10px rgba(255,255,255,0.2);

  display: none;
}
</style>
</head>

<body>

<!-- FLOATING CARDS -->
<div class="floating-cards">
  <div class="card">🇪🇺 EURUSD<br>1.0912</div>
  <div class="card">🇬🇧 GBPUSD<br>1.2704</div>
  <div class="card">🇯🇵 USDJPY<br>153.67</div>
  <div class="card">🟡 XAUUSD<br>2025</div>
</div>

<div class="container">
  
  <h2>
    <div class="title-main">SAHIL FX</div>
    <div class="title-sub">CALCULATOR</div>
  </h2>

  <label>Instrument</label>
  <select id="pair" onchange="togglePrice(); calculate();">
    <option value="EURUSD">🇪🇺 🇺🇸 EUR/USD</option>
    <option value="AUDUSD">🇦🇺 🇺🇸 AUD/USD</option>
    <option value="NZDUSD">🇳🇿 🇺🇸 NZD/USD</option>
    <option value="USDJPY">🇺🇸 🇯🇵 USD/JPY</option>
    <option value="USDCAD">🇺🇸 🇨🇦 USD/CAD</option>
    <option value="XAUUSD">🟡 XAU/USD</option>
  </select>

  <div id="priceBox" style="display:none;">
    <label>Enter Price</label>
    <input type="number" id="price" oninput="calculate()">
  </div>

  <label>Risk Amount ($)</label>
  <input type="number" id="risk" oninput="calculate()">

  <div class="quick-risk">
    <button onclick="setRisk(50)">$50</button>
    <button onclick="setRisk(100)">$100</button>
    <button onclick="setRisk(250)">$250</button>
  </div>

  <label>Stop Loss (pips)</label>
  <input type="number" id="sl" oninput="calculate()">

  <div class="result">
    <div style="display:flex; justify-content:space-between;">
      <span>Lot Size</span>
      <span id="lot">0.00</span>
    </div>
  </div>

  <button id="installBtn">⬇ INSTALL APP</button>
</div>

<script>
function togglePrice() {
  let pair = document.getElementById("pair").value;
  let box = document.getElementById("priceBox");
  box.style.display =
    (pair === "USDJPY" || pair === "USDCAD" || pair === "XAUUSD")
    ? "block" : "none";
}

function setRisk(value) {
  document.getElementById("risk").value = value;
  calculate();
}

function calculate() {
  let pair = document.getElementById("pair").value;
  let risk = parseFloat(document.getElementById("risk").value);
  let sl = parseFloat(document.getElementById("sl").value);
  let price = parseFloat(document.getElementById("price").value);

  if (!risk || !sl) return;

  let pipValue;

  if (["EURUSD","AUDUSD","NZDUSD"].includes(pair)) pipValue = 10;
  else if (pair === "USDJPY") { if (!price) return; pipValue = 1000 / price; }
  else if (pair === "USDCAD") { if (!price) return; pipValue = 10 / price; }
  else if (pair === "XAUUSD") pipValue = 1;

  let lot = risk / (sl * pipValue);
  document.getElementById("lot").innerText = lot.toFixed(2);
}

let deferredPrompt;

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("installBtn").style.display = "block";
});

document.getElementById("installBtn").addEventListener("click", () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt = null;
  }
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
