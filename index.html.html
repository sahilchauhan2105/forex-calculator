<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forex Position Size Calculator</title>

<style>

/* ===== GLOBAL ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', sans-serif;
}

body {
  background: linear-gradient(135deg, #0f172a, #020617);
  color: white;
  height: 100vh;
  overflow-x: hidden;
}

/* ===== CONTAINER ===== */
.container {
  max-width: 420px;
  margin: auto;
  margin-top: 60px;
  padding: 25px;
  border-radius: 20px;
  backdrop-filter: blur(20px);
  background: rgba(255, 255, 255, 0.05);
  box-shadow: 0 0 40px rgba(0, 255, 255, 0.1);
  transition: 0.4s;
}

.container:hover {
  box-shadow: 0 0 60px rgba(0, 255, 200, 0.3);
}

/* ===== TITLE ===== */
h1 {
  text-align: center;
  margin-bottom: 20px;
  font-size: 24px;
  background: linear-gradient(90deg, #00f5ff, #00ff88);
  -webkit-background-clip: text;
  color: transparent;
}

/* ===== INPUTS ===== */
input, select {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.08);
  color: white;
  font-size: 14px;
}

/* ===== BUTTON ===== */
button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(90deg, #00f5ff, #00ff88);
  color: black;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 20px #00ffcc;
}

/* ===== RESULT ===== */
.result {
  margin-top: 20px;
  padding: 15px;
  border-radius: 12px;
  background: rgba(0,255,150,0.1);
  text-align: center;
  font-size: 18px;
}

/* ===== FOOTER ===== */
.footer {
  text-align: center;
  margin-top: 15px;
  font-size: 12px;
  opacity: 0.6;
}

/* ===== FLOATING LOGOS ===== */
.floating-logos img {
  position: absolute;
  width: 40px;
  opacity: 0.15;
  animation: float 10s infinite linear;
}

.logo1 { top: 10%; left: 5%; }
.logo2 { top: 30%; right: 10%; }
.logo3 { bottom: 20%; left: 15%; }
.logo4 { bottom: 10%; right: 20%; }

@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-25px); }
  100% { transform: translateY(0px); }
}

</style>
</head>

<body>

<!-- FLOATING LOGOS -->
<div class="floating-logos">
  <img src="https://cdn-icons-png.flaticon.com/512/555/555526.png" class="logo1">
  <img src="https://cdn-icons-png.flaticon.com/512/555/555526.png" class="logo2">
  <img src="https://cdn-icons-png.flaticon.com/512/555/555526.png" class="logo3">
  <img src="https://cdn-icons-png.flaticon.com/512/555/555526.png" class="logo4">
</div>

<!-- MAIN APP -->
<div class="container">
  <h1>Forex Position Size</h1>

  <input type="number" id="balance" placeholder="Account Balance ($)">
  <input type="number" id="risk" placeholder="Risk % (e.g. 1)">
  <input type="number" id="stoploss" placeholder="Stop Loss (pips)">

  <select id="pair">
    <option value="10">EURUSD</option>
    <option value="10">GBPUSD</option>
    <option value="10">AUDUSD</option>
    <option value="10">NZDUSD</option>
    <option value="9">USDJPY</option>
    <option value="1">XAUUSD (Gold)</option>
  </select>

  <button onclick="calculateLot()">Calculate Lot Size</button>

  <div class="result" id="result">Your lot size will appear here</div>

  <div class="footer">Made by Sahil Chauhan 🚀</div>
</div>

<script>

function calculateLot() {
  let balance = parseFloat(document.getElementById("balance").value);
  let risk = parseFloat(document.getElementById("risk").value);
  let sl = parseFloat(document.getElementById("stoploss").value);
  let pipValue = parseFloat(document.getElementById("pair").value);

  if (!balance || !risk || !sl) {
    document.getElementById("result").innerText = "Please fill all fields";
    return;
  }

  let riskAmount = (balance * risk) / 100;
  let lotSize = riskAmount / (sl * pipValue);

  document.getElementById("result").innerText =
    "Lot Size: " + lotSize.toFixed(2);
}

</script>

</body>
</html>
