<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Position Size Calculator</title>

<style>

/* ===== GLOBAL ===== */
body {
  background: #0b1220;
  color: white;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* ===== CARD ===== */
.container {
  width: 380px;
  padding: 25px;
  border-radius: 16px;
  background: #111827;
  box-shadow: 0 0 40px rgba(0,0,0,0.6);
}

/* ===== TITLE ===== */
h1 {
  text-align: center;
  margin-bottom: 20px;
}

/* ===== LABEL ===== */
label {
  font-size: 13px;
  color: #9ca3af;
}

/* ===== INPUT / SELECT ===== */
input, select {
  width: 100%;
  padding: 12px;
  margin-top: 5px;
  margin-bottom: 15px;
  border-radius: 10px;
  border: 1px solid #374151;
  background: #1f2937;
  color: white;
  font-size: 14px;
}

/* FIX DROPDOWN ISSUE */
select option {
  background: #1f2937;
  color: white;
}

/* ===== BUTTON ===== */
button {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  background: #10b981;
  color: black;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #059669;
}

/* ===== RESULT ===== */
.result-box {
  margin-top: 20px;
  padding: 15px;
  background: #1f2937;
  border-radius: 12px;
}

.result-row {
  display: flex;
  justify-content: space-between;
  margin: 5px 0;
}

.green {
  color: #10b981;
  font-weight: bold;
}

</style>
</head>

<body>

<div class="container">
  <h1>Position Size</h1>

  <!-- Instrument -->
  <label>Instrument</label>
  <select id="pair">
    <option value="10">EURUSD</option>
    <option value="10">GBPUSD</option>
    <option value="10">AUDUSD</option>
    <option value="10">NZDUSD</option>
    <option value="9">USDJPY</option>
    <option value="1">XAUUSD (Gold)</option>
  </select>

  <!-- Risk Amount -->
  <label>Risk Amount ($)</label>
  <input type="number" id="risk" placeholder="Enter risk amount">

  <!-- Stop Loss -->
  <label>Stop Loss (pips)</label>
  <input type="number" id="sl" placeholder="Enter stop loss">

  <button onclick="calculate()">Calculate</button>

  <!-- RESULT -->
  <div class="result-box">
    <div class="result-row">
      <span>Standard Lots</span>
      <span class="green" id="lot">0.00</span>
    </div>
    <div class="result-row">
      <span>Risk Amount</span>
      <span id="riskShow">$0</span>
    </div>
  </div>
</div>

<script>

function calculate() {
  let risk = parseFloat(document.getElementById("risk").value);
  let sl = parseFloat(document.getElementById("sl").value);
  let pip = parseFloat(document.getElementById("pair").value);

  if (!risk || !sl) {
    alert("Fill all fields");
    return;
  }

  let lot = risk / (sl * pip);

  document.getElementById("lot").innerText = lot.toFixed(2);
  document.getElementById("riskShow").innerText = "$" + risk;
}

</script>

</body>
</html>
