<script>

let currentPrice = null;

// 🔥 STABLE GOLD SYSTEM
function getGoldPrice() {
  let saved = localStorage.getItem("goldPrice");

  if (!saved) {
    let base = 2300;
    localStorage.setItem("goldPrice", base);
    return base;
  }

  let price = parseFloat(saved);

  // small realistic movement
  let change = (Math.random() * 2 - 1); // -1 to +1
  price += change;

  localStorage.setItem("goldPrice", price);

  return price;
}

// FETCH PRICE
async function getPrice(pair) {
  try {

    if (pair === "XAUUSD") {
      currentPrice = getGoldPrice();

      document.getElementById("price").innerText =
        "Gold: " + currentPrice.toFixed(2) + " 🟡";

      calculate();
      return;
    }

    let url = `https://api.frankfurter.app/latest?from=${pair.slice(0,3)}&to=${pair.slice(3,6)}`;
    let res = await fetch(url);
    let data = await res.json();

    let quote = pair.slice(3,6);
    currentPrice = data.rates[quote];

    document.getElementById("price").innerText =
      "Price: " + currentPrice.toFixed(4);

  } catch {
    document.getElementById("price").innerText = "Price unavailable";
    currentPrice = null;
  }

  calculate();
}

// CALCULATE
function calculate() {
  let risk = parseFloat(document.getElementById("risk").value);
  let sl = parseFloat(document.getElementById("sl").value);
  let rr = parseFloat(document.getElementById("rr").value);
  let pair = document.getElementById("pair").value;

  if (!risk || !sl || !currentPrice) return;

  let pipValue;

  if (pair === "EURUSD" || pair === "AUDUSD" || pair === "NZDUSD") {
    pipValue = 10;
  }
  else if (pair === "USDJPY") {
    pipValue = (0.01 / currentPrice) * 100000;
  }
  else if (pair === "USDCAD") {
    pipValue = (0.0001 / currentPrice) * 100000;
  }
  else if (pair === "XAUUSD") {
    pipValue = 1;
  }

  let lot = risk / (sl * pipValue);
  let tp = sl * rr;

  document.getElementById("lot").innerText = lot.toFixed(2);
  document.getElementById("riskResult").innerText = "$" + risk;
  document.getElementById("tp").innerText = tp + " pips";
}

// EVENTS
document.getElementById("pair").addEventListener("change", () => {
  getPrice(document.getElementById("pair").value);
});

document.querySelectorAll("input").forEach(el => {
  el.addEventListener("input", calculate);
});

// AUTO REFRESH
setInterval(() => {
  getPrice(document.getElementById("pair").value);
}, 3000);

// INIT
getPrice(document.getElementById("pair").value);

</script>
